name: Build SKYNET Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skynet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate project
        run: |
          set -euo pipefail
          test -s settings.gradle
          test -s build.gradle
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace clean assembleDebug
          else
            gradle --no-daemon --stacktrace clean assembleDebug
          fi

      - name: Verify and prepare APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APP_ID="$(grep -Eo "applicationId[[:space:]]+['\"][^'\"]+['\"]" app/build.gradle | head -n1 | sed -E "s/.*['\"]([^'\"]+)['\"]$/\1/")"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-info.txt
          grep -F "package: name='$APP_ID'" apk-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" SKYNET-debug.apk
          sha256sum SKYNET-debug.apk | tee apk-sha256.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKYNET-debug-APK
          path: |
            SKYNET-debug.apk
            apk-info.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: SKYNET Android build ${{ github.run_number }}
          body: |
            Automated SKYNET Android APK build.
            Package and APK signature verified by GitHub Actions.
            Debug build for testing.
          files: SKYNET-debug.apk
          prerelease: false
          make_latest: true
          generate_release_notes: true
